# CI — CareerPilot AI
#
# IMPORTANT (repository layout): this repo's tracked content lives under a
# single top-level `careerpilot-ai/` directory (GitHub Actions only discovers
# workflows in `.github/workflows` at the REPOSITORY ROOT). This file lives at
# the root so Actions can trigger it; every step accounts for the nesting.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Server tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careerpilot-ai/server
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/careerpilot_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: careerpilot-ai/server/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit / security / integration tests (real MongoDB)
        run: npm test -- --detectOpenHandles
      - name: Audit (fail on HIGH/CRITICAL)
        run: |
          # Fail closed: a real HIGH/CRITICAL finding is deterministic and fails
          # immediately. We only retry when the npm advisory SERVICE itself is
          # transiently unavailable (503 / network timeout).
          for i in 1 2 3; do
            out=$(npm audit --audit-level=high 2>&1)
            code=$?
            if [ $code -eq 0 ]; then exit 0; fi
            if ! echo "$out" | grep -qE 'Service Unavailable|returned an error|network timeout|ECONNREFUSED'; then
              echo "$out"
              exit $code
            fi
            echo "npm audit advisory-service error (attempt $i); retrying after registry outage"
            sleep 10
          done
          echo "npm audit advisory service persistently unavailable"
          exit 1

  client:
    name: Client typecheck + build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careerpilot-ai/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: careerpilot-ai/client/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build
      - name: Audit (fail on HIGH/CRITICAL)
        run: |
          # Fail closed: a real HIGH/CRITICAL finding fails immediately; only
          # transient npm advisory-service outages (503/timeout) are retried.
          for i in 1 2 3; do
            out=$(npm audit --audit-level=high 2>&1)
            code=$?
            if [ $code -eq 0 ]; then exit 0; fi
            if ! echo "$out" | grep -qE 'Service Unavailable|returned an error|network timeout|ECONNREFUSED'; then
              echo "$out"
              exit $code
            fi
            echo "npm audit advisory-service error (attempt $i); retrying after registry outage"
            sleep 10
          done
          echo "npm audit advisory service persistently unavailable"
          exit 1

  python:
    name: Python AI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careerpilot-ai/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: careerpilot-ai/ai/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Import + startup check
        run: python -c "import main; from fastapi.testclient import TestClient; c=TestClient(main.app); assert c.get('/health').status_code == 200"
      - name: Test suite
        run: python -m pytest -q

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careerpilot-ai/client
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/careerpilot_ci_e2e
      JWT_SECRET: ci-e2e-secret-not-used-in-prod
      NODE_ENV: development
      CLIENT_URL: http://localhost:3000
      AI_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: careerpilot-ai/client/package-lock.json
      - name: Install server deps
        run: npm ci
        working-directory: careerpilot-ai/server
      - name: Install client deps + Playwright
        run: npm ci && npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npx playwright test --reporter=list

  docker:
    name: Compose + image build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config (CI-only placeholder secret)
        run: docker compose config -q
        working-directory: careerpilot-ai
        env:
          JWT_SECRET: ci-placeholder-secret-not-used-in-prod
      - name: Build server image
        run: docker build -t careerpilot-server ./careerpilot-ai/server
      - name: Build client image
        run: docker build -t careerpilot-client ./careerpilot-ai/client
      - name: Build AI image
        run: docker build -t careerpilot-ai ./careerpilot-ai/ai