name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install server dependencies
        run: cd server && npm ci --omit=dev
      - name: Run backend tests
        run: cd server && npm test -- --runInBand --detectOpenHandles
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/careerpilot_ai_test
          JWT_SECRET: test-secret
          NODE_ENV: test
          AI_PROVIDER: deterministic
          AI_SERVICE_URL: http://127.0.0.1:8000
      - name: Server dependency audit
        run: cd server && npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install client dependencies
        run: cd client && npm ci
      - name: TypeScript check
        run: cd client && npx tsc -b --noEmit
      - name: Build frontend
        run: cd client && npm run build
      - name: Client dependency audit
        run: cd client && npm audit --omit=dev --audit-level=high

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AI dependencies
        run: cd ai && pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Python tests
        run: cd ai && python -m pytest tests/ -v
      - name: Python compileall
        run: cd ai && python -m compileall app tests

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: node scripts/scan-secrets.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build --no-cache
